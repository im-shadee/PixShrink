name: Build and Create Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an official GitHub Release?'
        type: boolean
        default: false # Set to false by default so releases require explicit selection

permissions:
  contents: write # Needed to create GitHub Releases and Git Tags

jobs:
  build:
    name: Build and Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            python_artifact: pngopt.exe
            dotnet_exe: PixShrink.exe
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            python_artifact: pngopt
            dotnet_exe: PixShrink
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. Parse MainWindow.axaml.cs for Metadata
      # ----------------------------------------------------
      - name: Parse App Metadata from C# Source
        id: meta
        shell: bash
        run: |
          CS_FILE="PixShrink/Views/MainWindow.axaml.cs"

          APP_NAME=$(grep -E 's_AppName\s*=' "$CS_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NUM=$(grep -E 's_VersionNumber\s*=' "$CS_FILE" | sed -E 's/.*"([^"]+)".*/\1/')

          FOLDER_NAME="${APP_NAME}_${VERSION_NUM}_${{ matrix.rid }}"

          CLEAN_VER=$(echo "$VERSION_NUM" | sed -E 's/beta-?//I')
          if [[ "$VERSION_NUM" =~ [Bb][Ee][Tt][Aa] ]]; then
            TAG_NAME="v${CLEAN_VER}-beta"
          else
            TAG_NAME="v${CLEAN_VER}"
          fi

          # Environment variable for bash steps
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Step outputs for action inputs
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Parsed App Name: $APP_NAME"
          echo "Parsed Version:  $VERSION_NUM"
          echo "Target Folder:   $FOLDER_NAME"
          echo "Target Tag:      $TAG_NAME"

      # ----------------------------------------------------
      # 2. Build Python Helper (pngopt)
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Python Dependencies & Build PyInstaller
        run: python -m pip install --upgrade pip; pip install -r pngopt/requirements.txt; pip install pyinstaller; pyinstaller --onefile pngopt/pngopt.py --name ${{ matrix.python_artifact }}

      # ----------------------------------------------------
      # 3. Build .NET 10 Single-File Executable
      # ----------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET Single-File Executable
        run: dotnet publish PixShrink/PixShrink.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dotnet_out

      # ----------------------------------------------------
      # 4. Assemble Final Folder Directory Structure
      # ----------------------------------------------------
      - name: Clean & Assemble Output Directory
        shell: bash
        run: |
          mkdir -p "$FOLDER_NAME/Process"

          cp ./dotnet_out/${{ matrix.dotnet_exe }} "$FOLDER_NAME/"
          cp dist/${{ matrix.python_artifact }} "$FOLDER_NAME/Process/"

          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "$FOLDER_NAME/${{ matrix.dotnet_exe }}"
            chmod +x "$FOLDER_NAME/Process/${{ matrix.python_artifact }}"
          fi

      # ----------------------------------------------------
      # 5. Compress Archives (Separate ZIP and TAR.GZ)
      # ----------------------------------------------------
      - name: Create Zip Archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$FOLDER_NAME.zip" "$FOLDER_NAME"
          else
            zip -r "$FOLDER_NAME.zip" "$FOLDER_NAME"
          fi

      - name: Create tar.gz Archive (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: tar -czvf "$FOLDER_NAME.tar.gz" "$FOLDER_NAME"

      # ----------------------------------------------------
      # 6. Upload Artifacts (Separated by Archive Type)
      # ----------------------------------------------------
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.folder_name }}-zip
          path: "*.zip"

      - name: Upload Tar.gz Artifact (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.folder_name }}-targz
          path: "*.tar.gz"

  # ----------------------------------------------------
  # 7. Create GitHub Release
  # ----------------------------------------------------
  create-release:
    needs: build
    if: ${{ github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_assets

      - name: Parse Release Tag from C# Source
        id: parse_tag
        shell: bash
        run: |
          CS_FILE="PixShrink/Views/MainWindow.axaml.cs"
          VERSION_NUM=$(grep -E 's_VersionNumber\s*=' "$CS_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          CLEAN_VER=$(echo "$VERSION_NUM" | sed -E 's/beta-?//I')
          
          if [[ "$VERSION_NUM" =~ [Bb][Ee][Tt][Aa] ]]; then
            TAG_NAME="v${CLEAN_VER}-beta"
            IS_PRERELEASE="true"
          else
            TAG_NAME="v${CLEAN_VER}"
            IS_PRERELEASE="false"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_tag.outputs.tag_name }}
          name: Release ${{ steps.parse_tag.outputs.tag_name }}
          prerelease: ${{ steps.parse_tag.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            release_assets/**/*.zip
            release_assets/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
